<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train With Maggy | Plataforma Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-lavender: #b8a5fe;
            --accent-cyan: #70f3ff;
            --accent-magenta: #f472b6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* TRANSICIÓN SUAVE AL CAMBIAR DE TEMA */
        body { 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            transition: background 0.5s ease, color 0.5s ease;
        }

        .app-container { max-width: 500px; width: 100%; margin: 0 auto; margin-top: 40px; }

        /* --------------------------------------
           TEMA 1: LUXURY WELLNESS (MODO CLARO)
        --------------------------------------- */
        body.theme-light {
            background-color: #f8fafc; /* Blanco/Gris muy claro */
            background-image: none;
            color: #0f172a;
        }
        .theme-light .hub-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            border: 1px solid rgba(184, 165, 254, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }
        .theme-light .hub-title { color: #0f172a; }
        .theme-light .hub-logo-img { border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        /* --------------------------------------
           TEMA 2: NEBULOSA NEÓN (MESH GRADIENT)
        --------------------------------------- */
        body.theme-mesh {
            background-color: #0e0c1a;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(112, 243, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(184, 165, 254, 0.15), transparent 40%);
            color: #f8fafc;
        }
        .theme-mesh .hub-btn {
            background: rgba(29, 23, 51, 0.6);
            backdrop-filter: blur(10px);
            color: #ffffff;
            border: 1px solid rgba(184, 165, 254, 0.35);
        }
        .theme-mesh .hub-title { color: #ffffff; }
        .theme-mesh .hub-logo-img { border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 30px rgba(184, 165, 254, 0.3); }

        /* --------------------------------------
           TEMA 3: FOTO GIMNASIO OSCURO (PHOTO BLUR)
        --------------------------------------- */
        body.theme-photo {
            background-color: #09090b;
            /* Aquí he puesto una foto de gimnasio oscuro de prueba de Unsplash */
            background-image: linear-gradient(rgba(9, 9, 11, 0.85), rgba(9, 9, 11, 0.95)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
        }
        .theme-photo .hub-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .theme-photo .hub-title { color: #ffffff; }
        .theme-photo .hub-logo-img { border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        /* ESTILOS COMUNES */
        .hub-profile { text-align: center; margin-bottom: 36px; }
        .hub-logo-img { width: 130px; height: 130px; border-radius: 24px; object-fit: cover; margin: 0 auto 18px; display: block; transition: all 0.5s ease; }
        .hub-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; transition: color 0.5s ease; }
        .hub-subtitle { font-size: 11px; color: var(--accent-lavender); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; font-weight: 700; }
        .button-stack { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        
        .hub-btn {
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .hub-btn:hover {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-lavender) 100%);
            color: #0e0c1a !important;
            border-color: transparent !important;
            transform: translateY(-2px);
        }

        /* BARRA TEMPORAL PARA PROBAR TEMAS */
        .theme-tester {
            background: #ffeb3b;
            color: #000;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            font-weight: bold;
        }
        .theme-btn {
            background: #000; color: #fff; border: none; padding: 6px 12px; margin: 5px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
    </style>
</head>
<body class="theme-mesh"> <!-- Empieza con el tema Nebulosa por defecto -->

    <!-- PANEL MÁGICO PARA PROBAR COLORES (LO BORRAREMOS LUEGO) -->
    <div class="theme-tester">
        <p style="margin-bottom: 8px;">🛠️ Prueba de Fondos (Haz Clic):</p>
        <button class="theme-btn" onclick="document.body.className='theme-light'">1. Luxury Claro (Blanco)</button>
        <button class="theme-btn" onclick="document.body.className='theme-mesh'">2. Nebulosa Oscura</button>
        <button class="theme-btn" onclick="document.body.className='theme-photo'">3. Foto Gimnasio</button>
    </div>

    <!-- VISTA PRINCIPAL HUB -->
    <div class="app-container" id="view-hub">
        <div class="hub-profile">
            <img src="logo.png" alt="Maggy Antypas Logo" class="hub-logo-img">
            <h1 class="hub-title">Train With Maggy</h1>
            <p class="hub-subtitle">Plataforma Nutrición & Entrenamiento</p>
        </div>

        <div class="button-stack">
            <button class="hub-btn">🥗 NUTRICIÓN</button>
            <button class="hub-btn">🏋️ PROGRAMAS</button>
            <button class="hub-btn">🎓 CAMPUS</button>
            <button class="hub-btn">💬 SLACK</button>
            <button class="hub-btn">📊 MI PERFIL</button>
        </div>
    </div>

</body>
</html>
